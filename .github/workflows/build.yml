name: Само билд (без скрейп)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build index.html
        run: python3 gramofonche.py build

      - name: Commit
        run: |
          git config user.name "gramofonche-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Билд: index.html от template.html $(date +%F)"
          git push
